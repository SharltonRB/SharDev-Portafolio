<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHAR.DEV — Under construction</title>
  <meta name="description" content="SHAR.DEV — Sharlton Romero, Java Backend Engineer. One endpoint at a time. Portfolio under construction.">
  <meta name="theme-color" content="#0A0A0A">
  <meta property="og:title" content="SHAR.DEV — One endpoint at a time.">
  <meta property="og:description" content="Java Backend Engineer. Portfolio under construction.">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    @font-face { font-family: 'Silkscreen'; font-weight: 400; font-display: swap; src: url('assets/fonts/silkscreen-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Silkscreen'; font-weight: 700; font-display: swap; src: url('assets/fonts/silkscreen-latin-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Space Grotesk'; font-weight: 400; font-display: swap; src: url('assets/fonts/space-grotesk-latin-400-normal.woff2') format('woff2'); }

    :root {
      --primary: #FF6B35;       /* 60 % */
      --primary-dark: #C2410C;
      --ink: #0A0A0A;           /* 30 % */
      --accent: #22D3EE;        /* 10 % */
      --canvas: #FAFAFA;
      --muted: #A3A3A3;
      --font-display: 'Silkscreen', 'Courier New', monospace;
      --font-body: 'Space Grotesk', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(14px, 4vw, 48px);
      background-color: var(--ink);
      background-image:
        linear-gradient(#181818 2px, transparent 2px),
        linear-gradient(90deg, #181818 2px, transparent 2px);
      background-size: 48px 48px;
      color: var(--canvas);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    /* rombos pixel decorativos */
    .dm { position: fixed; width: 12px; height: 12px; background: var(--primary); transform: rotate(45deg); animation: float 4s ease-in-out infinite; }
    .dm.c { background: var(--accent); }
    @keyframes float { 0%,100% { translate: 0 0; } 50% { translate: 0 -10px; } }

    .win {
      position: relative;
      width: min(960px, 100%);
      border: 5px solid var(--primary);
      box-shadow: 12px 12px 0 var(--primary-dark);
      background-color: #111;
      background-image:
        linear-gradient(#1C1C1C 2px, transparent 2px),
        linear-gradient(90deg, #1C1C1C 2px, transparent 2px);
      background-size: 48px 48px;
    }
    .bar {
      display: flex; align-items: center; gap: 10px;
      background: var(--primary); color: var(--ink);
      padding: 10px 16px;
      border-bottom: 5px solid var(--ink);
      font-family: var(--font-display); font-size: clamp(11px, 1.6vw, 15px); letter-spacing: .12em; text-transform: uppercase;
    }
    .bar i { width: 14px; height: 14px; background: var(--ink); flex: none; }
    .bar span { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    main { padding: clamp(28px, 7vw, 76px) clamp(18px, 5vw, 56px) clamp(24px, 5vw, 44px); text-align: center; }
    .logo { display: block; width: min(640px, 100%); height: auto; margin: 0 auto; image-rendering: pixelated; }
    .slogan {
      margin: clamp(22px, 4vw, 40px) 0 0;
      font-family: var(--font-display); font-weight: 700;
      font-size: clamp(16px, 3.4vw, 34px); line-height: 1.3; letter-spacing: .08em; text-transform: uppercase;
      color: var(--canvas);
    }
    .status { margin-top: clamp(30px, 6vw, 56px); }
    .status h1 {
      margin: 0; font-family: var(--font-display); font-weight: 400;
      font-size: clamp(14px, 2.4vw, 22px); letter-spacing: .14em; text-transform: uppercase; color: var(--primary);
    }
    .status h1 .cursor { display: inline-block; width: .6em; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .track { width: min(520px, 100%); height: 26px; margin: 16px auto 0; border: 4px solid var(--primary); padding: 3px; background: var(--ink); }
    .fill {
      height: 100%; width: 0;
      background: repeating-linear-gradient(90deg, var(--primary) 0 14px, transparent 14px 18px);
      animation: load 5s steps(10, end) infinite;
    }
    @keyframes load { 0% { width: 0; } 85%, 100% { width: 100%; } }
    .es { margin: 16px 0 0; font-size: clamp(13px, 2vw, 16px); color: var(--muted); }
    footer { margin-top: clamp(26px, 5vw, 44px); font-size: 12px; color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      .dm, .cursor, .fill { animation: none; }
      .fill { width: 70%; }
    }
  </style>
</head>
<body>
  <!-- rombos decorativos -->
  <div class="dm" style="left:4%;top:12%"></div>
  <div class="dm c" style="left:92%;top:18%;animation-delay:-1s"></div>
  <div class="dm" style="left:8%;top:84%;animation-delay:-2s"></div>
  <div class="dm" style="left:94%;top:78%;animation-delay:-.5s"></div>
  <div class="dm c" style="left:50%;top:4%;animation-delay:-3s"></div>

  <div class="win">
    <div class="bar" aria-hidden="true"><i></i><i></i><i></i><span>Status: building...</span></div>
    <main>
      <img class="logo" src="assets/shardev-navbar-dark.svg" alt="SHAR.DEV logo" width="655" height="160">
      <p class="slogan">One endpoint at a time.</p>

      <div class="status">
        <h1>Under construction<span class="cursor">_</span></h1>
        <div class="track" role="progressbar" aria-label="Site under construction"><div class="fill"></div></div>
        <p class="es" lang="es">Sitio en construcción · Un endpoint a la vez.</p>
      </div>
      <footer>© 2026 Sharlton Romero</footer>
    </main>
  </div>
</body>
</html>
